server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolve AOS at request time so a recreated AOS container (and its
  # new bridge IP) does not leave this proxy pointing at the old address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(ask|ask_structured|task|human_approve|human_reject|intents|auth|api|ui)(/|$) {
    set $aos_upstream http://aos:9090;
    proxy_pass $aos_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
