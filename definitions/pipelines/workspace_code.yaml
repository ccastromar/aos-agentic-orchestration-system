pipelines:
  - name: pipeline_workspace_create_code
    mode: linear
    skip_summary: true
    governed: false
    ungoverned_reason: "Not an AI system: writes the given content, runs the tests and returns the diff, with no model."
    description: "Lee el archivo objetivo, escribe código, ejecuta tests y devuelve el diff"
    steps:
      - id: write_code
        tool: workspace.write_file
        with_params:
          path: "{{ .path }}"
          content: "{{ .content }}"
      - id: run_tests
        tool: workspace.run_tests
      - id: inspect_diff
        tool: workspace.git_diff
        with_params:
          path: "{{ .path }}"
