pipelines:
  - name: pipeline_protocols_demo
    mode: linear
    description: "Demonstrates MCP, gRPC and A2A protocol steps"
    steps:
      - id: crm_lookup
        tool: crm.mcp_lookup
        with_params:
          id: "{{ .customerId }}"
      - id: risk_score
        tool: risk.grpc_score
        depends_on: [crm_lookup]
        with_params:
          customerId: "{{ .customerId }}"
      - id: compliance_review
        tool: compliance.a2a_review
        depends_on: [risk_score]
        with_params:
          # Compliance decides on the risk the previous step measured, not on the customer id alone.
          message: "Review customer {{ .customerId }}: risk band {{ index . \"risk.grpc_score.result.band\" }}, score {{ index . \"risk.grpc_score.result.score\" }}"
