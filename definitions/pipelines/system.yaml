pipelines:
  - name: pipeline_recall_history
    mode: linear
    description: "Recall the recent operations executed in this session and summarize them"
    steps:
      - tool: system.recall
      - analyst: true

  - name: pipeline_system_fallback
    mode: linear
    description: "General chat answering queries using context and RAG memory"
    steps:
      - tool: system.rag_query
      - analyst: true
