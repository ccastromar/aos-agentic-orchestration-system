pipelines:
  - name: pipeline_service_status
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    description: "Get service status"
    steps:
      - tool: devops.infra_get_status
        with_params: {}

  - name: pipeline_restart_service
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    description: "Restart a service"
    steps:
      - tool: devops.infra_restart_service
        no_approval_reason: "Operator-initiated restart of one named service; incident.resolve_outage is the path with an SRE approval."
        with_params: {}
      - tool: devops.infra_get_status
        with_params: {}

  - name: pipeline_deploy_service
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    description: "Deploy a service"
    steps:
      - tool: devops.infra_deploy_service
        no_approval_reason: "Operator-initiated deploy of an explicit version of one named service."
        with_params: {}
      - tool: devops.infra_get_status
        with_params: {}

  - name: pipeline_tail_logs
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    description: "Query logs of the service"
    steps:
      - tool: devops.infra_tail_logs
        with_params: {}
