pipelines:
  - name: pipeline_workspace_update_readme
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    mode: linear
    description: "Lista el workspace, lee README.md, añade una nota y vuelve a leerlo"
    steps:
      - id: list_workspace
        tool: workspace.tree
      - id: read_readme_before
        tool: workspace.read_file
        with_params:
          path: "README.md"
      - id: append_readme
        tool: workspace.append_file
        with_params:
          path: "README.md"
          text: "\n\n{{ .text }}\n"
      - id: read_readme_after
        tool: workspace.read_file
        with_params:
          path: "README.md"
