pipelines:
  - name: pipeline_aos_support_lookup
    description: "Governed customer-support lookup demonstration"
    ai_system: "${AOS_PRUDENCE_DEMO_SYSTEM_ID}"
    governed: true
    steps:
      - tool: customer_support.governed_case_lookup
      - analyst: true

  - name: pipeline_customer_support_return_product
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    description: "Return a product (demo)"
    steps:
      - tool: customer_support.get_purchase
      - tool: customer_support.product_return
