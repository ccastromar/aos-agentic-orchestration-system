pipelines:
  - name: pipeline_openapi_demo
    governed: false
    ungoverned_reason: "Not an AI system: deterministic tool calls; the result is returned as is, with no model."
    skip_summary: true
    description: "Pipeline to test openapi dynamic tools"
    mode: dag
    steps:
      - id: "step1"
        tool: "testapi.getUser" # Generated from Swagger
        with_params:
          userId: "{{ .userId }}"
      
      - id: "step2"
        tool: "testapi.createPost" # Generated from Swagger
        depends_on: ["step1"]
        with_params:
          title: "{{ .title }}"
          userId: "{{ .userId }}"
