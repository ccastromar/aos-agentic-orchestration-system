tools:
  - name: crm.mcp_lookup
    type: mcp
    target: "${AOS_MOCK_BASE_URL:-http://localhost:9000}/mock/mcp"
    operation: "tools/call"
    description: "Call the CRM MCP server"
    mode: read
    timeout: 10000

  - name: risk.grpc_score
    type: grpc
    target: "${AOS_MOCK_GRPC_TARGET:-localhost:9002}"
    insecure: true # the local mock speaks plaintext; real services use TLS
    service: "risk.RiskService"
    method: "Score"
    description: "Score a case through the internal risk service"
    mode: read
    timeout: 3000

  - name: compliance.a2a_review
    type: a2a
    target: "${AOS_MOCK_BASE_URL:-http://localhost:9000}/mock/a2a"
    operation: "message/send"
    agent: "compliance-agent"
    description: "Delegate a review task to a remote A2A agent"
    mode: write
    timeout: 30000
