name: Images

# A release tag (v*) scans (Trivy) and publishes the AOS server image to GHCR with an SBOM and build provenance
# attached, and signs it with Sigstore cosign (keyless: the identity is this workflow run).
# Run by hand it only builds, unless "publish" is ticked. The console (ui/) is not published:
# its identity provider and URLs are build arguments, so each deployment builds its own.
# How to verify an image: SECURITY.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push, attest and sign (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # keyless signing

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Scan before publishing: a critical vulnerability with a fix available stops the release.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: scan/aos:local
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/aos:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'

      - name: Sign
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
